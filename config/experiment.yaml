# Experiment parameters (TS-10). Code reads these; change them here only.

golden_seed: 20261029          # stratified sampling of the golden set (TS-2.3)

# Schema drift levels (TS-3.2): share of the 16 canonical headers renamed.
# round(level * 16) -> 1, 2, 5 headers.
drift_levels: [0.05, 0.15, 0.30]

# One noised variant per (level, seed) (TS-3.1). The variant's random generator
# is seeded with [seed, level in percent], so levels are independent.
seeds: [1, 2, 3, 4, 5]
