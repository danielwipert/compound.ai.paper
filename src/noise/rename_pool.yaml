  - prft_rto
  - itemProfitRatio
  - marginPct
  - "Profit margin (item)"
  - "Line margin ratio"

order_item_quantity:
  - itm_qty
  - ord_qty
  - itemQty
  - unitsOrdered
  - "Units (line)"
  - "Quantity ordered"

