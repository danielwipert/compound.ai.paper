# Alternate header names for schema drift (TS-3.2).
#
# For each canonical field: 6 alternates, 2 in each style:
#   1. abbreviated snake_case   2. vendor-style camelCase   3. semantic paraphrase
#
# order_id and order_item_id are never renamed (join key must survive), so they
# have no entry. Every alternate must be unique and must not collide with any
# canonical field name, even ignoring case and punctuation (tests check this).

sales:
  - sls_amt
  - sales_usd
  - grossSales
  - lineRevenue
  - "Revenue (line)"
  - "Gross sale value"

benefit_per_order:
  - net_ord_margin_usd
  - ben_per_ord
  - orderProfit
  - netEarnings
  - "Profit (per order)"
  - margin_contribution

order_item_profit_ratio:
